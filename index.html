<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe (X and O)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>
        <div id="message-box">X starts!</div>
        <div class="player-status">
            <div id="player-x-indicator" class="player-tag">X</div>
            <div class="vs-text">VS</div>
            <div id="player-o-indicator" class="player-tag">O</div>
        </div>
        <div class="controls">
            <button id="reset-button">Start New Game</button>
        </div>
        <div id="board"></div>
    </div>
    <footer class="app-footer">
        Done By Rajat Kumar Das
    </footer>
    <script src="script.js"></script>
</body>
</html>
